# MongoDB Configuration (REQUIRED - Set MONGODB_URI in Render environment variables)
# DO NOT hardcode credentials here - use environment variables only
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:algohire}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# JWT Configuration (REQUIRED - Set JWT_SECRET in Render environment variables)
# Generate a strong secret: use a 32+ character random string
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Port (platforms like Railway/Render set PORT env variable)
server.port=${PORT:8080}

# Frontend URL for CORS (set this to your deployed frontend URL)
# Example: https://your-app.vercel.app or https://your-app.netlify.app
frontend.url=${FRONTEND_URL:}

# Redis Configuration (optional - use environment variables)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

